[project]
name = "matrix"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mattis Jung", email = "mattis2612@outlook.de" }
]
dependencies = [
    "pygame>=2.6.1",
    "pandas>=3.1.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.rye.scripts]
main = "python -m src.matrix.main"
player = "python -m src.matrix.playermatrix"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/matrix"]
